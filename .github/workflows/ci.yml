name: CI

# Every test: the existing ctest suite, the Japanese conjugation corpus, the
# Japanese parity tests against the 35e2dab oracle (docs/languages.md 11.3),
# the language conformance test once per pack (12.1), and the Node tools
# (tools/check-classes.mjs, tools/check-yomitan.mjs, node --test).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Yomitan at the pinned revision (for tools/check-yomitan.mjs)
        uses: actions/checkout@v4
        with:
          repository: yomidevs/yomitan
          ref: d3c54c10264673eca0d66b970ef74cd5c8b048e3
          path: yomitan
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DHOSHIDICTS_TESTS=ON -DHOSHIDICTS_DEINFLECTOR_TESTS=ON -DHOSHIDICTS_LANGUAGE_TESTS=ON
          -DHOSHIDICTS_CLI=ON -DHOSHIDICTS_BENCHMARK=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: The embedded packs match languages/
        run: python3 tools/embed-packs.py --check
      - name: ctest (existing tests, Japanese parity, language conformance)
        run: ctest --test-dir build --output-on-failure --parallel 4
      - name: Character classes against JavaScript (tools/check-classes.mjs)
        run: node tools/check-classes.mjs --all
      - name: Rules and processors against Yomitan (tools/check-yomitan.mjs)
        run: node tools/check-yomitan.mjs yomitan --all --cli build/hoshidicts-cli
      - name: Tool tests (node --test)
        run: node --test tools/test/
